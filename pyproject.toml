[project]
name = "nispo"
version = "0.2.1"
description = "SMILES to IUPAC naming tool optimized by OPSIN roundtrip benchmarks."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Nicholas T. Runcie" },
]
maintainers = [
  { name = "Oxford Protein Informatics Group" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "rdkit>=2024.9.6",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-xdist>=3", "pytest-timeout>=2.4"]

[project.urls]
Repository = "https://github.com/oxpig/nispo"
Issues = "https://github.com/oxpig/nispo/issues"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests/core"]
addopts = "-ra --strict-markers"
markers = [
  "core: Focused routine regression contracts.",
  "corpus: Preserved historical corpus contracts, selected explicitly.",
  "integration: Bounded external-parser integration checks.",
  "workers: Process transport and deadline contracts.",
  "modes(*names): Applicable API modes or fixed cohort membership; selected before execution.",
  "current_only: Requires the current structured API.",
  "full_only: Contract targets the full-mode interface.",
  "fast_only: Contract targets fast-mode delivery.",
  "public_only: Requires the archived public release.",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["nispo", "nispo.*"]
namespaces = false

[tool.setuptools.package-data]
nispo = [
  "resources/bluebook_retained_hydrocarbon_parents.json",
  "resources/numbered_c60_parent.json",
  "resources/three_face_aza_numbered_witness.json",
  "resources/imidazo_quinoline_numbered_witness.json",
  "resources/general_three_face_numbered_witness_v2.json",
  "resources/OPSIN_NUMBERING_WITNESS_LICENSE.txt",
  "resources/opsin_tokens/*.xml",
  "resources/generated_fused_template_element_graph_index.json",
  "resources/generated_fused_template_graph_index.json",
  "resources/generated_fused_template_index.json",
  "resources/generated_fused_template_index_records.json.gz",
  "resources/generated_fused_templates.json",
  "resources/generated_spiro_scaffold_templates.json",
  "resources/high_impact_fused_parent_templates.json",
  "resources/opsin_polyacene_helicene_templates.json",
  "resources/opsin_polycyclic_arene_templates.json",
  "resources/opsin_retained_mono_fused_ring_smiles.csv",
  "resources/opsin_retained_mono_fused_ring_templates.json",
  "resources/opsin_test_scaffold_templates.json",
]

"nispo._fast_engine" = [
  "LICENSE",
  "resources/*.json",
  "resources/*.json.gz",
  "resources/*.csv",
  "resources/opsin_tokens/*.xml",
]

[tool.setuptools.exclude-package-data]
"nispo" = [
  ".DS_Store",
  "__pycache__/*",
  "*.py[cod]",
  "*/__pycache__/*",
  "resources/generated_fused_template_index_records.json",
  "graphify-out/*",
  "graphify-out/**/*",
]
"nispo.acyclic" = [
  ".DS_Store",
  "__pycache__/*",
  "*.py[cod]",
]
"nispo.branch" = [
  ".DS_Store",
  "__pycache__/*",
  "*.py[cod]",
]
"nispo.parent" = [
  ".DS_Store",
  "__pycache__/*",
  "*.py[cod]",
]
"nispo.ring" = [
  ".DS_Store",
  "__pycache__/*",
  "*.py[cod]",
]
