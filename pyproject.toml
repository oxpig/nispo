[project]
name = "nispo"
version = "0.1.3"
description = "SMILES to IUPAC naming tool optimized by OPSIN roundtrip benchmarks."
readme = "README.md"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
nispo = ["resources/opsin_tokens/*.xml", "resources/*.json"]
